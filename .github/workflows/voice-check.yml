name: Stimmen-Check
on:
  push:
    branches: [durchschaut]
    paths: ['voice_test/transcribe.py']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q faster-whisper
      - run: python voice_test/transcribe.py
