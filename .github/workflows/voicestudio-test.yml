name: Stimmen-Test VoiceStudio (Shorts)
on:
  push:
    branches: [durchschaut]
    paths: ['voice_test/voicestudio_go.txt']
  workflow_dispatch:
permissions:
  contents: write
concurrency: render
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: remotion/package-lock.json}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts pillow numpy scipy faster-whisper
      - run: npm ci --no-audit --no-fund
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Mikrowellen-Shorts mit VoiceStudio-Aufnahmen rendern
        run: python renderer/build.py voice_test/vs_mikrowelle.json --only shorts
      - name: Ergebnis speichern
        run: |
          git config user.name "durchschaut-bot"
          git config user.email "actions@users.noreply.github.com"
          git add up/mikrowelle_voicestudio audio_cache
          git commit -m "VoiceStudio-Test: Mikrowellen-Shorts [skip ci]" || exit 0
          git pull --rebase origin durchschaut && git push origin HEAD:durchschaut
