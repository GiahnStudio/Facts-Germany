name: Stimmen-Test ElevenLabs
on:
  workflow_dispatch:
    inputs:
      voice_id:
        description: 'ElevenLabs Voice-ID (aus "My Voices" bzw. Voice Library)'
        required: true
        default: 'JBFqnCBsd6RMkjVDRZzb'
      model:
        description: 'Modell (eleven_multilingual_v2 oder eleven_v3)'
        required: false
        default: 'eleven_multilingual_v2'
permissions:
  contents: write
concurrency: render
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: remotion/package-lock.json}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts pillow numpy faster-whisper
      - run: npm ci --no-audit --no-fund
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Verfügbare Stimmen und Kontingent
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          [ -n "$ELEVENLABS_API_KEY" ] || { echo "::error::Kein ELEVENLABS_API_KEY als Secret hinterlegt"; exit 1; }
          curl -sf -H "xi-api-key: $ELEVENLABS_API_KEY" https://api.elevenlabs.io/v1/user/subscription \
            | python -c "import json,sys;d=json.load(sys.stdin);print('Tarif:',d.get('tier'),'| Zeichen genutzt:',d.get('character_count'),'/',d.get('character_limit'))" || echo "Kontingent nicht abrufbar"
          curl -sf -H "xi-api-key: $ELEVENLABS_API_KEY" https://api.elevenlabs.io/v1/voices \
            | python -c "import json,sys;[print(v['voice_id'],'|',v['name'],'|',v.get('labels',{})) for v in json.load(sys.stdin)['voices']]" || true
      - name: Kühlschrank-Folge mit ElevenLabs rendern (nur Hauptvideo)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python - <<PY
          import json
          p='voice_test/eleven_kuehlschrank.json'; d=json.load(open(p))
          d['voice']='eleven:${{ github.event.inputs.voice_id }}:${{ github.event.inputs.model }}'
          json.dump(d,open('/tmp/eleven_ep.json','w'),ensure_ascii=False)
          PY
          python renderer/build.py /tmp/eleven_ep.json --only main
      - name: Ergebnis speichern
        run: |
          git config user.name "durchschaut-bot"
          git config user.email "actions@users.noreply.github.com"
          git add up/kuehlschrank_elevenlabs audio_cache
          git commit -m "ElevenLabs-Test: Kühlschrank [skip ci]" || exit 0
          git pull --rebase origin durchschaut && git push origin HEAD:durchschaut
