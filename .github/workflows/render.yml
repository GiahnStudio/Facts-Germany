name: Folgen rendern
on:
  push:
    branches: [durchschaut]
    paths: ['episodes/**']
  workflow_dispatch:
    inputs:
      episode:
        description: 'Pfad der Folge, z. B. episodes/01_pfandautomat.json (leer = alle ohne fertiges Video)'
        required: false
permissions:
  contents: write
concurrency: render
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: remotion/package-lock.json}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts pillow numpy scipy faster-whisper
      - run: npm ci --no-audit --no-fund
        working-directory: remotion
      - run: npx remotion browser ensure
        working-directory: remotion
      - name: Folgen bestimmen
        id: eps
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            LIST="${{ github.event.inputs.episode }}"
          else
            LIST=$(git diff --name-only HEAD~1 HEAD -- episodes/ 2>/dev/null | grep '\.json$' || true)
            for f in episodes/*.json; do
              slug=$(python -c "import json;print(json.load(open('$f'))['slug'])")
              [ -f "up/$slug/${slug}_video.mp4" ] || LIST="$LIST $f"
            done
          fi
          LIST=$(for f in $LIST; do [ -f "$f" ] && echo $f; done | sort -u | tr '\n' ' ')
          echo "list=$LIST" >> $GITHUB_OUTPUT
          echo "Rendere: $LIST"
      - name: Rendern (jede Folge wird sofort gespeichert)
        if: steps.eps.outputs.list != ''
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: |
          git config user.name "durchschaut-bot"
          git config user.email "actions@users.noreply.github.com"
          FAIL=0
          for f in ${{ steps.eps.outputs.list }}; do
            if python renderer/build.py "$f"; then
              git add up audio_cache
              git commit -m "Gerendert: $f [skip ci]" || true
              git pull --rebase origin durchschaut && git push origin HEAD:durchschaut
            else
              echo "::error::Rendern fehlgeschlagen: $f"; FAIL=1
              git add audio_cache && git commit -m "Audio-Zwischenstand: $f [skip ci]" && git pull --rebase origin durchschaut && git push origin HEAD:durchschaut || true
            fi
          done
          exit $FAIL
